name: hana-map 거점 좌표 수집 (OSM)
on:
  workflow_dispatch:
    inputs:
      types:
        description: '수집할 유형(공백 구분, 비우면 전체)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python hana-map/feed/osm_pois.py ${{ github.event.inputs.types }}
      - name: 커밋
        run: |
          git config user.name "hana-map-bot"
          git config user.email "hana-map-bot@users.noreply.github.com"
          git add hana-map/data/osm_pois.json
          git commit -m "hana-map: OSM 거점 좌표 수집" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

name: hana-map 거점 좌표 수집 (OSM)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python hana-map/feed/osm_pois.py
      - name: 커밋
        run: |
          git config user.name "hana-map-bot"
          git config user.email "hana-map-bot@users.noreply.github.com"
          git add hana-map/data/osm_pois.json
          git commit -m "hana-map: OSM 거점 좌표 수집" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

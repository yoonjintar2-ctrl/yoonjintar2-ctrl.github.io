<style>
:root{--bg:#fff;--ink:#1d232a;--muted:#6b7580;--warn:#d9480f;--info:#1c6fc9;--good:#2b8a3e;--bad:#d6336c;--box:#f3f4f6;--line:#e6e9ec;--body:#495057}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 24px}
.clock{text-align:center;font-size:11px;color:var(--muted);padding-top:8px;font-variant-numeric:tabular-nums}
.clock span{margin:0 8px;white-space:nowrap}
.head{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.head h1{flex:1;min-width:0;margin:0;font-size:22px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;line-height:1.1}
.head h1 .bi{width:40px;height:40px;flex:none;object-fit:contain}
.head h1 small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;padding-top:3px}
.right{display:flex;flex-direction:column;align-items:flex-end}
.icons{display:flex;gap:8px}
.icons button{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icons button img{width:100%;height:100%;display:block}
.icons button:active{transform:scale(.92)}
.upd{font-size:11px;color:var(--muted);padding-top:3px}
.prog{padding:0 0 10px}
.prog .lab{font-size:12px;color:var(--info);padding-bottom:5px}
.prog .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .quip{font-size:12px;color:var(--muted);padding-top:6px;min-height:17px;transition:opacity .35s}
.prog .fill{height:100%;width:0;background:var(--info);border-radius:3px;transition:width .25s linear}
.note{font-size:13px;color:var(--muted);padding:14px 4px;line-height:1.5}
.card{position:relative;margin:4px 0 16px;padding-top:14px}
.card .badge{position:absolute;left:14px;top:0;height:32px;z-index:2}
.frame{border:22px solid transparent;border-image:var(--fr) 80 / 22px stretch;background:#fff;background-clip:padding-box;margin:0}
.inner{margin:-10px -6px -11px;padding:0}
.top{display:flex;align-items:flex-end;gap:8px;padding-top:12px}
.tk{flex:1;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font-size:16px;line-height:1;padding-bottom:4px}
.sub{font-size:12px;color:var(--muted);padding-top:4px;line-height:1.4}
.now{font-size:13px;color:var(--body);padding:4px 0;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:center;gap:10px;padding:2px 0 8px}
.spark svg{flex:1;height:34px;min-width:0}
.spark .lab{font-size:10px;color:var(--muted);line-height:1.3}
.spark .lab b{display:block;font-size:12px}
.tbl{display:flex;background:var(--box);border-radius:8px}
.cell{flex:1;text-align:center;padding:7px 2px 6px;min-width:0}
.cell+.cell{border-left:1px solid #dfe3e7}
.cell .l{font-size:11px;color:#8a96a3}
.cell .v{font-size:15px;font-weight:800;padding-top:2px;font-variant-numeric:tabular-nums;word-break:keep-all}
.cell .s{font-size:11px;padding-top:1px}
.why{font-size:12px;color:var(--body);padding-top:8px;line-height:1.45;white-space:pre-line}
.status{text-align:center;font-size:11px;color:var(--muted);padding:14px 0 4px}
.status.bad{color:var(--warn)}
/* 트레이딩 카드 — 은색 테두리 + 규칙 색 카드 몸통(카드 게임 기본 구성), 등급은 등급 그림 + 반짝임 */
.tc{--ty:#5c7cfa;--ty2:#dbe4ff;position:relative;overflow:hidden;margin:6px auto 34px;max-width:420px;padding:8px;border-radius:16px;background:linear-gradient(135deg,#f8f9fa,#ced4da 22%,#f1f3f5 40%,#adb5bd 62%,#e9ecef 80%,#ced4da);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.tc .in{position:relative;z-index:1;border-radius:10px;padding:7px 10px 8px;background:radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.55),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(255,255,255,.35),transparent 60%),linear-gradient(170deg,color-mix(in srgb,var(--ty) 30%,#fff),color-mix(in srgb,var(--ty) 50%,#fff) 55%,color-mix(in srgb,var(--ty) 38%,#fff));box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tc .hd{display:flex;align-items:center;gap:6px;min-height:34px}
.tc .stage{flex:none;font-size:10px;font-weight:800;color:#495057;background:linear-gradient(180deg,#fff,#ced4da);padding:2px 12px 2px 7px;clip-path:polygon(0 0,100% 0,85% 100%,0 100%);border-radius:3px 0 0 3px;font-style:italic;align-self:flex-start;margin-top:2px}
.tc .nm{flex:1;min-width:0;font-size:21px;font-weight:900;letter-spacing:-.4px;line-height:1.15;word-break:keep-all;color:#1d232a}
.tc .nm .ep{display:block;font-size:13px;font-weight:800;color:#343a40;line-height:1.3}
.tc .nm small{font-size:11px;font-weight:700;color:#495057;margin-left:4px}
.tc .gimg{height:28px;width:auto;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.tc .orb{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:radial-gradient(circle at 35% 30%,#fff,var(--ty) 75%);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.35)}
.tc .art{position:relative;margin:4px 2px 0;aspect-ratio:4/3;border:3px solid transparent;background:linear-gradient(135deg,var(--ty2),var(--ty)) padding-box,linear-gradient(135deg,#fff,#adb5bd 40%,#f1f3f5 60%,#868e96) border-box;box-shadow:0 2px 4px rgba(0,0,0,.25);overflow:hidden;max-width:100%}
.tc .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tc .art .no{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;color:rgba(255,255,255,.85);font-weight:900}
.tc .dex{margin:5px 6px 0;font-size:10.5px;color:#343a40;text-align:center;background:linear-gradient(180deg,#fff,#dee2e6 60%,#ced4da);clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%);padding:2px 14px;font-variant-numeric:tabular-nums}
.tc .mv{padding:10px 2px 2px}
.tc .mvh{display:flex;align-items:center;gap:8px}
.tc .cost{display:flex;gap:2px;flex:none;min-width:52px}
.tc .cost i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--ty) 72%);box-shadow:0 0 0 1.5px #fff,0 1px 2px rgba(0,0,0,.35)}
.tc .mvn{flex:1;min-width:0;font-size:18px;font-weight:900;letter-spacing:-.3px;color:#1d232a}
.tc .dmg{font-size:22px;font-weight:900;color:#1d232a;white-space:nowrap;font-variant-numeric:tabular-nums}
.tc .mvd{font-size:12.5px;line-height:1.5;color:#212529;padding:4px 0 0;white-space:pre-line}
.tc .tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:0;margin-top:9px;border-top:2px solid rgba(255,255,255,.85);border-bottom:2px solid rgba(255,255,255,.85);box-shadow:0 -1px 0 rgba(0,0,0,.08),0 1px 0 rgba(0,0,0,.08)}
.tc .tg>div{text-align:center;padding:4px 2px;min-width:0}
.tc .tg>div+div{border-left:1px solid rgba(255,255,255,.8)}
.tc .tg .l{font-size:9.5px;color:#495057;font-weight:700}
.tc .tg .v{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;word-break:keep-all}
.tc .tg .s{font-size:10.5px;font-weight:700;opacity:.85}
.tc .spark{padding:4px 0 0}
.tc .spark svg{height:26px}
.tc .fl{margin:6px 0 0;font-size:11px;line-height:1.45;color:#343a40;white-space:pre-line;text-align:left}
.tc .ft{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;color:#495057;padding-top:6px;font-style:italic}
.tc .ft b{font-style:normal;font-weight:900;letter-spacing:.5px}
/* 등급 표시: 문구 + 반짝임(S 무지개 · A 금빛 · B+ 은빛 · B 회색) */
.bdg{display:inline-flex;align-items:baseline;gap:2px;flex:none;font-weight:900;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;color:#fff;background:#868e96;letter-spacing:-.3px;white-space:nowrap;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.3)}
.bdg small{font-size:10px;font-weight:800;opacity:.9}
.bdg.big{font-size:17px;padding:5px 10px}
.bdg.tA{background:linear-gradient(110deg,#aeb8c6 0%,#eef1f4 30%,#ffffff 45%,#d0d6de 60%,#9aa5b4 100%);background-size:250% 100%;color:#212529;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.35)}
.bdg.tS{background:linear-gradient(110deg,#b8860b 0%,#f5c518 30%,#fff3b0 45%,#f5c518 60%,#b8860b 100%);background-size:250% 100%;color:#4a3300;box-shadow:0 0 0 1.5px #fff,0 0 8px rgba(255,212,59,.8)}
.bdg.tC{background:#9aa1a9;color:#fff;box-shadow:0 0 0 1.5px #fff}
.bdg.tBp,.bdg.tB{background:linear-gradient(110deg,#6b3a1f,#c98a63 45%,#6b3a1f);background-size:250% 100%;color:#fff}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
/* 도감 미니 카드: 칸 높이가 달라도 위아래 여백 같게 */
.mc{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
.mc .mci{flex:1}
.tc .shr{flex:none;width:24px;height:24px;border:0;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#343a40;background:radial-gradient(circle at 35% 30%,#fff,#dee2e6 80%);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent}
.tc .shr svg{width:13px;height:13px;display:block}
.tc .shr .ck{display:none}
.tc .shr.ok{color:#fff;background:radial-gradient(circle at 35% 30%,#8ce99a,#2b8a3e 80%)}
.tc .shr.ok .lk{display:none}.tc .shr.ok .ck{display:block}
.tc.dark .shr{color:#e9ecef;background:radial-gradient(circle at 35% 30%,#868e96,#212529 80%);box-shadow:0 0 0 2px #495057,0 1px 3px rgba(0,0,0,.5)}
.tc{scroll-margin-top:14px}
.tc.hl{animation:hl 1.6s ease-out 2}
/* A·S 진주빛 펄 코팅(2026-10-15 석진 선택): 카드 전체에 파스텔 펄 막이 천천히 돌고, 문지르면 빛이 따라옴 */
.pl{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;background:conic-gradient(from calc(var(--mx,.5) * 360deg) at 30% 20%,#ffd6e7,#fff3bf,#d3f9d8,#d0ebff,#e5dbff,#ffd6e7);mix-blend-mode:multiply;opacity:.5}
.mc .pl{opacity:.45}
.tc:has(.pl){transform:perspective(900px) rotateX(calc((var(--my,.3) - .5) * -8deg)) rotateY(calc((var(--mx,.5) - .5) * 10deg));will-change:transform}
.mc:has(.pl){transform:perspective(700px) rotateX(calc((var(--my,.3) - .5) * -8deg)) rotateY(calc((var(--mx,.5) - .5) * 10deg))}
.tc .gl,.mc .gl{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at calc(var(--mx,.5) * 100%) calc(var(--my,.3) * 100%),rgba(255,255,255,.55),rgba(255,255,255,0) 42%);mix-blend-mode:soft-light}
@keyframes hl{0%{box-shadow:0 0 0 0 rgba(255,212,59,.95)}60%{box-shadow:0 0 0 14px rgba(255,212,59,0)}100%{box-shadow:0 0 0 0 rgba(255,212,59,0)}}
/* 테두리 색 = 등급: S~SSS 금(반짝임) · A-~A+ 은 · B+ 이하 동 */
.tc.gS,.mc.gS{background:linear-gradient(135deg,#fff3bf,#e8a400 22%,#ffe066 40%,#b8860b 62%,#ffd43b 80%,#c99700);background-size:200% 200%;animation:goldflow 4s ease-in-out infinite alternate}
.tc.gA,.mc.gA{background:linear-gradient(135deg,#ffffff,#d0d6de 20%,#f8f9fa 38%,#b8c0ca 58%,#eef1f4 78%,#c8cfd8)}
.tc.gA{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.14)}
.tc.gBp,.tc.gB,.mc.gBp,.mc.gB{background:linear-gradient(135deg,#c98a63,#6b3a1f 25%,#a8643c 45%,#4e2a14 65%,#93562f 82%,#5c3218)}
@keyframes goldflow{from{background-position:0% 0%}to{background-position:100% 100%}}
.tc.gS{box-shadow:0 0 0 1px rgba(184,134,11,.4),0 4px 18px rgba(232,164,0,.45)}
/* 반짝임 — S: 무지개 홀로가 카드 몸통에 흐르고 별이 반짝 · A: 은은한 빛줄기와 별 · B+: 빛줄기만 · B: 없음 */
.tc .in::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0}
.tc .in>*{position:relative;z-index:1}
.tc.gS::after{content:"";position:absolute;inset:-40%;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.45) 50%,transparent 56%);animation:sweep 3.6s ease-in-out infinite}
@keyframes holo{from{background-position:0% 50%}to{background-position:300% 50%}}
@keyframes sweep{0%{transform:translate(-45%,-45%)}60%,100%{transform:translate(45%,45%)}}
@keyframes twinkle{from{opacity:.2}to{opacity:.9}}
@media (prefers-reduced-motion:reduce){.bdg,.tc,.mc,.tc::after,.tc .in::before,.tc .in::after,.mc::after{animation:none!important}}
/* C등급 상시 카드: 톤 낮게 · 눈에 덜 띄게(무광 회색 테두리, 흐린 그림, 작은 글씨) */
.mc.gC{background:#9aa1a9}
.tc.gC{background:#9aa1a9;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:5px}
.tc.gC .in{background:#f8f9fa;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.tc.gC .art{aspect-ratio:16/6;border-width:1px;background:#e9ecef;box-shadow:none}
.tc.gC .art img{filter:saturate(.35) brightness(1.04);opacity:.85}
.tc.gC .art .no{display:none}
.tc.gC .nm{font-size:17px;color:#495057}
.tc.gC .nm .ep{font-size:12px;color:#868e96}
.tc.gC .orb,.tc.gC .cost,.tc.gC .dmg{display:none}
.tc.gC .stage{background:#e9ecef;color:#868e96}
.tc.gC .dex{background:#e9ecef}
.tc.gC .mvn{font-size:15px;color:#495057}
.tc.gC .mvd,.tc.gC .fl{color:#6c757d}
.tc.gC .tg .v{color:#495057!important}
.tc.gC .tg{border-color:#dee2e6;box-shadow:none}
.tc.gC .spark{opacity:.5}
/* ⑩ 인버스: 어두운 카드 */
.tc.dark .in{background:radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.10),transparent 60%),linear-gradient(170deg,#3b4046,#212529 55%,#2b3035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tc.dark .nm,.tc.dark .mvn,.tc.dark .dmg{color:#f1f3f5}
.tc.dark .nm .ep,.tc.dark .nm small{color:#ced4da}
.tc.dark .mvd,.tc.dark .fl,.tc.dark .ft{color:#ced4da}
.tc.dark .tg .l{color:#adb5bd}
.tc.dark .tg>div,.tc.dark .tg .v{color:#f1f3f5}
.tc.dark .tg{border-color:rgba(255,255,255,.25);box-shadow:none}
.tc.dark .tg>div+div{border-left-color:rgba(255,255,255,.2)}
.tc.dark .stage{background:linear-gradient(180deg,#868e96,#495057);color:#f1f3f5}
.mc.dark .mci{background:linear-gradient(170deg,#3b4046,#212529)}
.mc.dark .mn{color:#f1f3f5}
.mc.dark .mw,.mc.dark .mh b{color:#ced4da}
/* 사이트 설명(C+ 이상 카드 아래, 상시 카드 위) */
.about{max-width:420px;margin:22px auto 4px;padding:0 6px;text-align:center;font-size:11px;line-height:1.6;color:#868e96;word-break:keep-all}
.about b{font-weight:700;color:#6c757d}
/* 시뮬레이션 한 줄 · 올해 발동 · 실험 세팅 팝업 */
.tc .simln{margin-top:7px;font-size:12px;font-weight:700;color:#343a40;background:rgba(255,255,255,.6);border-radius:6px;padding:5px 8px;cursor:pointer;line-height:1.45}
.tc .simln u{font-weight:600;color:#1c7ed6;text-decoration:none;white-space:nowrap}
.tc.dark .simln{background:rgba(255,255,255,.08);color:#e9ecef}
.freqo{max-width:420px;margin:-26px auto 34px;padding:0 6px;font-size:11px;font-weight:400;color:#adb5bd;text-align:right}
.simpop[hidden]{display:none}
.simpop{position:fixed;inset:0;z-index:90;background:rgba(10,14,20,.6);display:grid;place-items:center;padding:20px}
.simbox{max-width:380px;width:100%;background:#fff;border-radius:14px;padding:16px 16px 10px;font-size:13px;line-height:1.6;color:#343a40;white-space:pre-line;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.simx{text-align:center;color:#1c7ed6;font-weight:800;padding-top:10px;cursor:pointer}
/* 매수 의견 없음(가운데, 크게) */
.none{text-align:center;padding:18px 8px 8px;color:var(--muted)}
.none b{display:block;font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.3px}
.none small{display:block;font-size:11.5px;line-height:1.5;padding-top:4px;word-break:keep-all}
/* 등급 설명 */
.glegend{font-size:12px;line-height:1.65;color:#495057;background:#f1f3f5;border-radius:10px;padding:10px 12px;margin-bottom:12px;word-break:keep-all}
.glegend small{color:#868e96}
/* 맨 위 이름 영역: 어두운 바탕 + 밝은 글씨(아래 카드 영역과 구분) */
.mast{position:relative;background:#1d232a;color:#f1f3f5;margin:0 -14px 14px;padding:env(safe-area-inset-top,0) 14px 10px;box-shadow:0 0 0 100vmax #1d232a;clip-path:inset(0 -100vmax)}
.mast .clock{color:#adb5bd}
html{background:#1d232a}

function handle(m, live){
  if (!m || m.event !== 'message' || state.seen[m.id]) return;
  state.seen[m.id] = 1;
  var tags = m.tags || [], body = String(m.message || '');
  if (m.topic === T.room) { addRoom(m); return; }
  if (tags.indexOf('chat') >= 0) return; // 맥 Claude 상담 답장(블랙베리 앱용)은 웹에선 안 보임
  if (tags.indexOf('ack') >= 0) { if (m.time * 1000 >= state.reqAt - 5000) state.ackAt = m.time * 1000; return; }
  if (body.charAt(0) === '{') {
    try { var j = JSON.parse(body); } catch(e) { return; }
    if (j.k === 'cset') { if (m.time >= (state.csetTime || 0)) { state.cset = j; state.csetTime = m.time; LS.set('bh_cset', j); LS.set('bh_csetTime', m.time); render(); } return; }
    if ((j.v || 0) >= 2 && m.time >= (state.resultTime || 0)) {
      state.result = j; state.resultTime = m.time; state.title = m.title || '';
      LS.set('bh_result', j); LS.set('bh_resultTime', m.time); LS.set('bh_title', state.title);
      if (tags.indexOf('req') >= 0 && state.reqAt && m.time * 1000 >= state.reqAt - 5000) finishProg(true);

  } else if (tags.indexOf('warn') >= 0 && tags.indexOf('req') >= 0 && state.reqAt) { finishProg(false, body); }
}

var quipAt = 0, quipI = Math.floor(Math.random() * QUIPS.length);
function quip(){ var e = $('progQuip'); if (Date.now() - quipAt < 3500) return; quipAt = Date.now(); e.style.opacity = 0; setTimeout(function(){ quipI = (quipI + 1 + Math.floor(Math.random() * 3)) % QUIPS.length; e.textContent = QUIPS[quipI]; e.style.opacity = 1; }, 300); }
function updProg(){
  var now = Date.now(), p, lab;
  if (state.doneAt) return;
  if (now - state.reqAt > 180000) { finishProg(false, '3분째 응답 없음 · 맥이나 크롬이 꺼져 있을 수 있어요'); return; }
  if (state.sending) { p = .06; lab = '맥에 검색 요청 보내는 중…'; }
  else if (!state.ackAt) { var e1 = (now - state.reqAt) / 1000; p = .12 + .13 * Math.min(1, e1 / 30); lab = '맥이 요청을 받는 중… ' + Math.floor(e1) + '초'; }
  else { var e2 = (now - state.ackAt) / 1000; p = .3 + .65 * (1 - Math.exp(-e2 / 40)); lab = '맥에서 지금 시세로 검색 중… ' + Math.floor(e2) + '초'; }
  $('progFill').style.width = (p * 100).toFixed(1) + '%'; $('progLab').textContent = lab; $('progLab').style.color = 'var(--info)'; quip();
}
function finishProg(ok, msg){
  if (!state.reqAt || state.doneAt) return;
  state.doneAt = Date.now(); clearInterval(progTimer);
  $('progQuip').textContent = ''; quipAt = 0;
  if (ok) { $('progFill').style.width = '100%'; $('progLab').textContent = '검색 완료'; $('progLab').style.color = 'var(--good)'; }
  else { $('progLab').textContent = msg || '검색 실패'; $('progLab').style.color = 'var(--warn)'; }
  setTimeout(function(){ $('prog').hidden = true; $('progFill').style.width = '0'; }, ok ? 1500 : 5000);
}

var NICK_A = ['용감한','느긋한','반짝이는','배고픈','졸린','신난','조용한','날쌘','든든한','엉뚱한','침착한','수상한','행복한','꼼꼼한','씩씩한'];

var ME = LS.get('bh_uid', '') || (function(){ var u = Math.random().toString(36).slice(2, 10); LS.set('bh_uid', u); return u; })();

function kstDay(sec){ return new Date(sec * 1000 + 9 * 3600e3).toISOString().slice(0, 10); }
function addRoom(m){ var j; try { j = JSON.parse(m.message || ''); } catch(e) { return; } if (!j || typeof j.x !== 'string') return;
  if (state.room.some(function(x){ return x.id === m.id; })) return;
  state.room.push({ id: m.id, t: m.time, n: String(j.n || '익명').slice(0, 12), u: String(j.u || ''), x: j.x.slice(0, 300) });
  state.room.sort(function(a, b){ return a.t - b.t; }); if (state.room.length > 300) state.room = state.room.slice(-300);
  renderChat(); chatDot(); }
function todayRoom(){ var d = kstDay(Date.now() / 1000); return state.room.filter(function(x){ return kstDay(x.t) === d; }); }
function chatDot(){ var open = $('chat').classList.contains('on'); var list = todayRoom(); var last = list.length ? list[list.length - 1].t : 0;
  if (open) { state.roomSeen = last; LS.set('bh_roomSeen', last); } $('chatDot').hidden = open || !(last > (state.roomSeen || 0)) || (list.length && list[list.length - 1].u === ME); }
function renderChat(){

  if (!list.length) h = '<div class="wait">오늘 대화가 아직 없어요. 첫 마디를 남겨 보세요. (욕설·광고·개인정보는 올리지 말아 주세요)</div>';
  list.forEach(function(c){ var me = c.u === ME, t = new Date(c.t * 1000).toTimeString().slice(0, 5);
    h += '<div class="msg ' + (me ? 'me' : 'bot') + '">' + (me ? '<span class="tm">' + t + '</span>' : '') + '<div class="mb">' + (!me && c.n !== prevN ? '<div class="nk">' + esc(c.n) + '</div>' : '') + '<div class="bub">' + esc(c.x) + '</div></div>' + (!me ? '<span class="tm">' + t + '</span>' : '') + '</div>';
    prevN = me ? '' : c.n; });
  var box = $('msgs'), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80; box.innerHTML = h; if (atEnd || !renderChat.once) box.scrollTop = box.scrollHeight; renderChat.once = 1;

var lastSend = 0;
function sendChat(){
  var q = $('q').value.trim(); if (!q) return;

var RULES = "■ 원칙\n백테스트를 통과한 규칙만 매수 의견을 내요. 신호가 없는 날이 대부분이고 \"매수 의견 없음\"이 정상이에요. 무기는 QQQ·TQQQ·UGL·SOXL·SOXS(④⑧만 개별 종목).\n\n■ 등급\n· S 강력 매수: 과거 승률 약 90%, 비중 크게\n· A 매수: 승률 약 73%, 비중 보통\n· B 참고: 기준보다 못해서 매수 안 함(제목에만 표시)\n· C+ 관찰: 아직 효과 검증이 안 끝난 방법. 조건이 되면 카드로 보여 주고 실전 기록이 쌓여 효과가 확인되면 등급을 올려요\n· C 상시: 언제 사도 되는 장기 보유 전략(수익이 느림)\n(알림은 B+ 이상만 울려요)\n(2011~2026 신호 236건 검증: S·A는 같은 종목 아무 날보다 +5~6%p, B는 −1.4%p)\n\n■ ① 급락 초입 → QQQ 40일\nS&P가 60일 고점 대비 −7% 이상, 단 직전 25일 안에 고점 근처였던 '초입'만. 23회 40일 +7.1% 승 74%. 며칠 늦게 사도 됨.\n\n■ ② 나스닥 박스 하단 → TQQQ (최대 15일)\nQQQ가 60일간 +12% 오른 뒤 폭 4~12% 박스, 15일 이상, 바닥 2번 확인, 하단 20% 안, 200일선 위. QQQ가 50일선 −3% 이내면 S. 목표 박스 75%, QQQ 박스 바닥 −4% 닿으면 바로 자동매도. 2일 안에 사야 함.\n\n■ ③ 유가 급등 + S&P 하락 → TQQQ 20~30일\n유가(USO) 하루 +5% 이상인데 S&P는 하락, QQQ 200일선 위. TQQQ 20일 +13.5% 승 78%.\n\n■ ④ 실적주 급락 + 공포 여론 → 개별주 20~60일\n3일 −8% 이상 급락, 매출 증가·흑자·부채비율 200% 미만. 토스 댓글에 '무섭·말이 되냐·한강·눈물·끝났·패닉' 같은 감정형 공포가 많고, '줍줍·물타기'나 '어디까지·살려' 같은 말보다 많을 때. 20일 +12~19% 승 79~87%(표본 작음).\n\n■ ⑤ 금리·금·은 동반 하락 → UGL 20일\n하루에 금리(IEF로 판단)·금·은이 모두 평소보다 크게 빠진 '다 팔아치우는 날'. 그날 S&P도 하락이면 A, 금이 50일선 위면 S. UGL 20일 +7.0% 승 77%.\n\n■ ⑥ 반도체만 급락 → TQQQ 20일(−15% 손절)\nQQQ는 200일선 위인데 반도체(SOXX)가 5일 −7% 이상. 34건 +8.7% 승 74%. 다음 날 시가까지 사야 함.\n\n■ ⑦ 1분봉 V자 반등 후 횡보(관찰, C+) → 당일 종가 매도\n미국장 개장 후 1시간 반 동안 5분마다 확인. 나스닥과 같이 빠졌다 회복한 V자만. 알림 없이 화면·기록만(B+).\n\n■ ⑧ 시장 급락일 과하게 빠진 종목 → 5~20일\n나스닥 −1.5% 이상 빠진 날, 평소 움직임(베타)보다 −5%p 이상 더 빠진 종목을 급락 직후 데이마켓에서 매수. 반도체 A(20일 +5.9%p 승 63%), 그 외 B+(+2.8%p 승 55%). 돌아서길 기다리면 수익 절반. 아침 8시 50분 검색. 실적 발표 때문에 빠진 종목은 자동으로 빼요(뉴스 제목으로 판단, 실적 급락은 20일 뒤에도 −1~−5%p로 약했음).\n\n■ ⑨ 반도체 급락 반등 → SOXL (최대 15거래일)\nSOXX 종가가 직전 20거래일 최고 종가보다 −12% 이상 빠지면 다음 날 SOXL 매수. 산 값 기준 +40% 익절, −20% 손절(SOXX로 약 −7%), 15거래일째 종가 매도. 2012~26 아무 날 산 것보다 건당 +9.2 / +1.5 / +7.7%p(기간별), 승률 57~67%. 5일 급락 속도로 재면 효과 없음(깊이가 중요). 반도체만 단체로 급락한 날(SOXX −3% 이하, S&P는 덜)엔 2거래일 기다렸다 사요. 위험 모드면 절반만.\n\n■ ⑩ 위험 모드 추세 이탈 → SOXS (최대 10거래일, 인버스)\n반반도체지수 90 이상인데 SOXX 종가가 20일선을 처음 밑돌면 다음 날 SOXS 매수. +15% 익절, −10% 손절 자동 주문 필수, 10거래일째 종가 매도. 30건 건당 +2.2 / +3.0 / +2.8%(아무 날 SOXS는 −1.2~−2.2%). 이기는 건 절반뿐이라 손절이 생명, 소액(B+).\n\n■ ⑪ 위기 매수 → QQQ·SOXX (1~3년, 몇 년에 한 번)\nQQQ나 SOXX가 최고가 대비 −30% · −40% · −50%에 처음 닿을 때마다 나눠서 사요. 총 매수 계획의 1차 30% · 2차 30% · 3차 40% — 카드에 이번에 넣을 비율이 적혀 있어요. 과거 위기 매수는 대부분 크게 벌었지만(2020 코로나 1년 +135%, 2022-09 3년 +154%), 2008·닷컴처럼 −30%에서 사도 −40~−75%가 더 남은 적이 있어서 한 번에 다 넣지 않아요. 최고가 대비 −15% 안으로 회복하면 다시 처음부터.\n\n■ 화면 아래 반반도체지수\n클석진 반반도체 지수와 지금 반도체 주식 의견 한 줄이 늘 떠 있고, 높을수록 진한 빨강이에요. 누르면 일봉 그래프(SOXX와 함께)가 열려요. 90 이상(위험 모드)이면 TQQQ와 ⑧ 반도체주 매수 의견은 평소의 절반만 사세요.\n\n■ ⓒ 상시 카드(C등급) — 언제 사도 되는 교과서적 장기 전략\n규칙 신호가 아니라 늘 떠 있는 카드예요. 수익은 낮거나 느리지만 등락을 견디는 용도이고, 알림·성적표에는 넣지 않아요.\n· 현금 대기(SGOV): 3개월 국채 금리 3% 이상일 때. 다른 카드를 기다리는 돈을 여기에.\n· 매달 적립(QQQ): 매달 같은 날 같은 금액, 팔지 않기. 2007년부터 7.5배·2011년부터 5.3배(넣은 돈 대비 최대 −39~−49%).\n· 매달 적립(QLD 2배): QQQ가 200일선 위일 때만 새로 넣기. 2011년부터 18.7배지만 최대 −67~−77%까지 빠졌던 돈이라 일부만.\n· 중기 국채(IEF): 10년 금리 4.5% 이상일 때 나눠 사서 높은 금리 고정. 주식 급락 때 버팀목.\n\n■ 이 웹 화면\n블랙베리 앱과 같은 결과를 보여 줘요. 새로고침(↻)은 집 맥에 지금 시세로 다시 찾아 달라고 요청해요(1~2분). 알림은 블랙베리 앱으로만 와요.\n아이폰 사파리에서 공유 → '홈 화면에 추가'하면 앱처럼 쓸 수 있어요.\n\n※ 참고용 신호예요. 주문은 직접 판단하세요.";

var RISK = "■ 클석진 반반도체 지수(반반도체지수) v5\n반도체(SOXX)가 앞으로 크게 빠질 위험을 0~100으로 보여 줘요. 매일 미국장 마감 기준으로 다시 계산하고, 두 축 중 낮은 값을 써요(둘 다 높아야 높음).\n\n· 급락 위험 축(주황): 미국 10년 금리 수준, 금융여건(NFCI) 13주 변화, 순유동성 감소, 원달러 수준(3년 대비), 기대인플레·유가 하락, 반도체 가이던스 감속, 장단기 금리차 축소, 2년 금리 120일 상승. 급락 확률은 잘 맞히지만 2023~26엔 높을 때 오히려 크게 오르기도 했어요(양방향 출렁임).\n· 사이클 축(파랑): 순유동성 감소, 반도체 매출 성장 감속, 10년 금리, 미국 반도체 가동률(생산/능력), 반도체 19개사 매출 성장(사이클 고점일수록 높음), 장단기차 축소, 2년 금리 상승. 높을 때 60일 뒤 수익이 세 기간 모두 낮았어요(4.1 vs 7.6% · −6.1 vs 10.9% · −4.2 vs 11.6%).\n\n· 90 이상 = 위험 모드(두 축 모두 90 이상): 그동안 현금으로 바꿨다면 SOXL 연 49.8→58.6%(2013~18) · 13.2→53.5%(2019~22) · 97.8→155.6%(2023~26), SOXX 19.5→21.7 · 21.5→32.1 · 50.4→60.0%. 위험 모드는 전체의 6~14%의 날\n· 한계: 요인을 같은 기간에서 골라 실전은 이보다 못할 수 있어요. 코로나·딥시크 같은 갑작스러운 충격은 못 잡아요. 매출 자료는 실적 시즌마다 갱신해요.\n\n■ 추가 하락 가능성(반도체가 20일 고점 대비 −8% 이상 빠졌을 때만)\n이미 빠진 뒤 '더 빠질까, 멈출까'를 봐요. 급락 위험 축, 금융여건 악화, 원화·달러 강세, 기대인플레 하락, 시장 전체 하락, VIX 단기 공포, 천천히 빠지는지를 합쳐요. 점수 상위 1/3이면 20일 안 −7% 더 빠질 확률 약 50%, 하위 1/3이면 15% 안팎.\n\n■ 알림: 위험 모드에 처음 들어갈 때(80 밑으로 내려갔다 다시 90을 넘으면 또), 반도체 급락(−8%)이 새로 시작될 때\n\n";

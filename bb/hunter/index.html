<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박스권 헌터</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="박스권 헌터">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="a/icon180.png?v=2">
<link rel="icon" href="a/icon180.png?v=2">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fff;--ink:#1d232a;--muted:#6b7580;--warn:#d9480f;--info:#1c6fc9;--good:#2b8a3e;--bad:#d6336c;--box:#f3f4f6;--line:#e6e9ec;--body:#495057}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 24px}
.clock{text-align:center;font-size:11px;color:var(--muted);padding-top:8px;font-variant-numeric:tabular-nums}
.clock span{margin:0 8px;white-space:nowrap}
.head{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.head h1{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.right{display:flex;flex-direction:column;align-items:flex-end}
.icons{display:flex;gap:8px}
.icons button{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icons button img{width:100%;height:100%;display:block}
.icons button:active{transform:scale(.92)}
.upd{font-size:11px;color:var(--muted);padding-top:3px}
.prog{padding:0 0 10px}
.prog .lab{font-size:12px;color:var(--info);padding-bottom:5px}
.prog .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--info);border-radius:3px;transition:width .25s linear}
.note{font-size:13px;color:var(--muted);padding:14px 4px;line-height:1.5}
.card{position:relative;margin:4px 0 16px;padding-top:14px}
.card .badge{position:absolute;left:14px;top:0;height:32px;z-index:2}
.frame{border:22px solid transparent;border-image:var(--fr) 80 / 22px stretch;background:#fff;background-clip:padding-box;margin:0}
.inner{margin:-10px -6px -11px;padding:0}
.top{display:flex;align-items:flex-end;gap:8px;padding-top:12px}
.tk{flex:1;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font-size:16px;line-height:1;padding-bottom:4px}
.sub{font-size:12px;color:var(--muted);padding-top:4px;line-height:1.4}
.now{font-size:13px;color:var(--body);padding:4px 0;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:center;gap:10px;padding:2px 0 8px}
.spark svg{flex:1;height:34px;min-width:0}
.spark .lab{font-size:10px;color:var(--muted);line-height:1.3}
.spark .lab b{display:block;font-size:12px}
.tbl{display:flex;background:var(--box);border-radius:8px}
.cell{flex:1;text-align:center;padding:7px 2px 6px;min-width:0}
.cell+.cell{border-left:1px solid #dfe3e7}
.cell .l{font-size:11px;color:#8a96a3}
.cell .v{font-size:15px;font-weight:800;padding-top:2px;font-variant-numeric:tabular-nums;word-break:keep-all}
.cell .s{font-size:11px;padding-top:1px}
.why{font-size:12px;color:var(--body);padding-top:8px;line-height:1.45;white-space:pre-line}
.status{text-align:center;font-size:11px;color:var(--muted);padding:14px 0 4px}
.status.bad{color:var(--warn)}
/* 트레이딩 카드 — 은색 테두리 + 규칙 색 카드 몸통(카드 게임 기본 구성), 등급은 등급 그림 + 반짝임 */
.tc{--ty:#5c7cfa;--ty2:#dbe4ff;position:relative;overflow:hidden;margin:6px auto 18px;max-width:420px;padding:8px;border-radius:16px;background:linear-gradient(135deg,#f8f9fa,#ced4da 22%,#f1f3f5 40%,#adb5bd 62%,#e9ecef 80%,#ced4da);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.tc .in{position:relative;z-index:1;border-radius:10px;padding:7px 10px 8px;background:radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.55),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(255,255,255,.35),transparent 60%),linear-gradient(170deg,color-mix(in srgb,var(--ty) 30%,#fff),color-mix(in srgb,var(--ty) 50%,#fff) 55%,color-mix(in srgb,var(--ty) 38%,#fff));box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tc .hd{display:flex;align-items:center;gap:6px;min-height:34px}
.tc .stage{flex:none;font-size:10px;font-weight:800;color:#495057;background:linear-gradient(180deg,#fff,#ced4da);padding:2px 12px 2px 7px;clip-path:polygon(0 0,100% 0,85% 100%,0 100%);border-radius:3px 0 0 3px;font-style:italic;align-self:flex-start;margin-top:2px}
.tc .nm{flex:1;min-width:0;font-size:21px;font-weight:900;letter-spacing:-.4px;line-height:1.15;word-break:keep-all;color:#1d232a}
.tc .nm .ep{font-size:14px;font-weight:800;color:#343a40}
.tc .nm small{font-size:11px;font-weight:700;color:#495057;margin-left:4px}
.tc .gimg{height:28px;width:auto;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.tc .orb{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:radial-gradient(circle at 35% 30%,#fff,var(--ty) 75%);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.35)}
.tc .art{position:relative;margin:4px 2px 0;aspect-ratio:4/3;border:3px solid transparent;background:linear-gradient(135deg,var(--ty2),var(--ty)) padding-box,linear-gradient(135deg,#fff,#adb5bd 40%,#f1f3f5 60%,#868e96) border-box;box-shadow:0 2px 4px rgba(0,0,0,.25);overflow:hidden;max-width:100%}
.tc .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tc .art .no{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;color:rgba(255,255,255,.85);font-weight:900}
.tc .dex{margin:5px 6px 0;font-size:10.5px;color:#343a40;text-align:center;background:linear-gradient(180deg,#fff,#dee2e6 60%,#ced4da);clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%);padding:2px 14px;font-variant-numeric:tabular-nums}
.tc .mv{padding:10px 2px 2px}
.tc .mvh{display:flex;align-items:center;gap:8px}
.tc .cost{display:flex;gap:2px;flex:none;min-width:52px}
.tc .cost i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--ty) 72%);box-shadow:0 0 0 1.5px #fff,0 1px 2px rgba(0,0,0,.35)}
.tc .mvn{flex:1;min-width:0;font-size:18px;font-weight:900;letter-spacing:-.3px;color:#1d232a}
.tc .dmg{font-size:22px;font-weight:900;color:#1d232a;white-space:nowrap;font-variant-numeric:tabular-nums}
.tc .mvd{font-size:12.5px;line-height:1.5;color:#212529;padding:4px 0 0;white-space:pre-line}
.tc .tg{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:9px;border-top:2px solid rgba(255,255,255,.85);border-bottom:2px solid rgba(255,255,255,.85);box-shadow:0 -1px 0 rgba(0,0,0,.08),0 1px 0 rgba(0,0,0,.08)}
.tc .tg>div{text-align:center;padding:4px 2px;min-width:0}
.tc .tg>div+div{border-left:1px solid rgba(255,255,255,.8)}
.tc .tg .l{font-size:9.5px;color:#495057;font-weight:700}
.tc .tg .v{font-size:13.5px;font-weight:900;font-variant-numeric:tabular-nums;word-break:keep-all}
.tc .tg .s{font-size:10px;font-weight:700}
.tc .spark{padding:4px 0 0}
.tc .spark svg{height:26px}
.tc .fl{margin:6px 0 0 18%;font-size:11px;line-height:1.45;color:#343a40;white-space:pre-line;text-align:left}
.tc .ft{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;color:#495057;padding-top:6px;font-style:italic}
.tc .ft b{font-style:normal;font-weight:900;letter-spacing:.5px}
/* 등급 표시: 문구 + 반짝임(S 무지개 · A 금빛 · B+ 은빛 · B 회색) */
.bdg{display:inline-flex;align-items:baseline;gap:2px;flex:none;font-weight:900;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;color:#fff;background:#868e96;letter-spacing:-.3px;white-space:nowrap;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.3)}
.bdg small{font-size:10px;font-weight:800;opacity:.9}
.bdg.big{font-size:17px;padding:5px 10px}
.bdg.tA{background:linear-gradient(110deg,#b8860b 0%,#f5c518 30%,#fff3b0 45%,#f5c518 60%,#b8860b 100%);background-size:250% 100%;color:#4a3300;animation:shine 2.6s linear infinite}
.bdg.tS{background:linear-gradient(110deg,#ff6b6b,#ffd43b,#69db7c,#4dabf7,#b197fc,#ff6b6b);background-size:300% 100%;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);animation:shine 2s linear infinite;box-shadow:0 0 0 1.5px #fff,0 0 8px rgba(255,255,255,.9)}
.bdg.tC{background:#5c940d;color:#fff}
.bdg.tBp{background:linear-gradient(110deg,#868e96,#dee2e6 45%,#868e96);background-size:250% 100%;color:#212529;animation:shine 3.5s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
/* 도감 미니 카드: 칸 높이가 달라도 위아래 여백 같게 */
.mc{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
.mc .mci{flex:1}
/* 테두리 색 = 등급: S~SSS 금(반짝임) · A-~A+ 은 · B+ 이하 동 */
.tc.gS,.mc.gS{background:linear-gradient(135deg,#fff3bf,#e8a400 22%,#ffe066 40%,#b8860b 62%,#ffd43b 80%,#c99700);background-size:200% 200%;animation:goldflow 4s ease-in-out infinite alternate}
.tc.gA,.mc.gA{background:linear-gradient(135deg,#f8f9fa,#ced4da 22%,#f1f3f5 40%,#adb5bd 62%,#e9ecef 80%,#ced4da)}
.tc.gBp,.tc.gB,.tc.gC,.mc.gBp,.mc.gB,.mc.gC{background:linear-gradient(135deg,#f3d1b0,#b87333 22%,#e8b48a 40%,#8c5a2b 62%,#d9a070 80%,#a8682f)}
@keyframes goldflow{from{background-position:0% 0%}to{background-position:100% 100%}}
.tc.gS{box-shadow:0 0 0 1px rgba(184,134,11,.4),0 4px 18px rgba(232,164,0,.45)}
/* 반짝임 — S: 무지개 홀로가 카드 몸통에 흐르고 별이 반짝 · A: 은은한 빛줄기와 별 · B+: 빛줄기만 · B: 없음 */
.tc .in::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0}
.tc .in>*{position:relative;z-index:1}
.tc.gS .in::before{background:linear-gradient(115deg,rgba(255,110,110,.0) 0%,rgba(255,110,110,.28) 15%,rgba(255,230,120,.28) 30%,rgba(120,240,170,.28) 45%,rgba(120,180,255,.28) 60%,rgba(200,140,255,.28) 75%,rgba(255,110,110,.0) 90%);background-size:300% 300%;mix-blend-mode:screen;animation:holo 6s linear infinite}
.tc.gS .in::after{content:"✦      ✧          ✦     ✧        ✦          ✧     ✦";position:absolute;inset:6% 0 auto;z-index:2;pointer-events:none;color:#fff;font-size:11px;white-space:pre;overflow:hidden;text-shadow:0 0 4px #fff;opacity:.8;animation:twinkle 1.8s ease-in-out infinite alternate}
.tc.gS::after{content:"";position:absolute;inset:-40%;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.45) 50%,transparent 56%);animation:sweep 3.6s ease-in-out infinite}
@keyframes holo{from{background-position:0% 50%}to{background-position:300% 50%}}
@keyframes sweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
@keyframes twinkle{from{opacity:.2}to{opacity:.9}}
@media (prefers-reduced-motion:reduce){.bdg,.tc,.mc,.tc::after,.tc .in::before,.tc .in::after,.mc::after{animation:none!important}}
/* 상시 카드 머리 */
.baseh{max-width:420px;margin:26px auto 8px;font-size:15px;font-weight:900;color:#5c940d}
.baseh small{display:block;font-size:11px;font-weight:600;color:var(--muted);padding-top:2px}
/* 규칙 카드 도감 */
.rules .rtext{white-space:pre-line;padding-top:18px;border-top:1px solid var(--line);margin-top:16px}
.rules{white-space:normal}
.bdh{font-size:12px;color:var(--muted);padding-bottom:8px}
.bind{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mc{position:relative;overflow:hidden;border:0;padding:5px;border-radius:12px;background:linear-gradient(135deg,#f8f9fa,#ced4da 22%,#f1f3f5 40%,#adb5bd 62%,#e9ecef 80%,#ced4da);cursor:pointer;text-align:left;font:inherit;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent}
.mc:active{transform:scale(.97)}
.mci{position:relative;z-index:1;border-radius:8px;background:linear-gradient(170deg,color-mix(in srgb,var(--ty) 30%,#fff),color-mix(in srgb,var(--ty) 50%,#fff));padding:4px 6px 7px}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:15px;min-height:22px}
.mh .gimg{height:18px;width:auto}
.mc.gS::after{content:"";position:absolute;inset:-40%;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.45) 50%,transparent 56%);animation:sweep 3.6s ease-in-out infinite}
.mh span{font-size:12px;font-weight:900;color:#c92a2a}
.ma{position:relative;aspect-ratio:1/1;margin-top:3px;border:3px solid;border-color:#e9ecef #adb5bd #adb5bd #e9ecef;background:linear-gradient(135deg,var(--ty2),var(--ty));overflow:hidden}
.ma img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ma .no{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:rgba(255,255,255,.85);font-weight:900}
.mn{font-size:13px;font-weight:900;padding-top:5px;line-height:1.3;letter-spacing:-.3px}
.mw{font-size:11px;color:var(--muted);padding-top:2px}
.ov{position:fixed;inset:0;z-index:70;background:rgba(10,14,20,.72);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0)) 14px calc(70px + env(safe-area-inset-bottom,0))}
.ov .tc{margin-top:0}
.ovX{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));border:0;border-radius:18px;background:#fff;color:var(--ink);font-weight:800;font-size:15px;padding:9px 22px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
/* 시트(상담·규칙) */
.sheet{position:fixed;inset:0;background:#f4f5f7;display:none;flex-direction:column;z-index:50}
.sheet.on{display:flex}
.sbar{display:flex;align-items:center;background:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;border-bottom:1px solid #e3e6ea}
.sbar .t{flex:1}
.sbar .t b{font-size:17px;display:block}
.sbar .t small{font-size:11px;color:var(--muted)}
.sbar button{border:0;background:none;color:var(--info);font-weight:700;font-size:15px;padding:6px 4px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.msg{display:flex;margin:6px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.me .bub{background:#1c6fc9;color:#fff;border-bottom-right-radius:5px}
.bot .bub{background:#fff;color:var(--ink);border-bottom-left-radius:5px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.tm{font-size:10px;color:#9aa3ad;align-self:flex-end;margin:0 5px 2px}
.wait{font-size:12px;color:var(--muted);padding:4px 6px}
.inrow{display:flex;gap:8px;align-items:flex-end;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0))}
.inrow textarea{flex:1;resize:none;border:0;background:#f1f3f5;border-radius:18px;padding:9px 13px;font:inherit;font-size:16px;color:var(--ink);max-height:120px;outline:none}
.inrow button{border:0;background:#1c6fc9;color:#fff;font-weight:700;font-size:15px;border-radius:16px;padding:9px 15px;cursor:pointer}
.rules{flex:1;overflow-y:auto;padding:14px 16px 30px;font-size:14px;line-height:1.6;white-space:pre-line;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#1d232a;color:#fff;font-size:13px;padding:8px 14px;border-radius:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:.92}
/* 클석진 반반도체 지수(하단 상시) */
.rbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0));border-top:1px solid rgba(0,0,0,.08);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .4s}
.rin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rtx{flex:1;min-width:0}
.rl{font-size:11px;opacity:.8;display:block}
.rmain{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rsub{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnum{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;flex:none;min-width:44px;text-align:center}
.rgo{font-size:18px;opacity:.6;flex:none}
/* 반반도체지수 일봉 팝업 */
.chartbox{flex:1;display:flex;flex-direction:column;background:#fff;min-height:0}
.rnow{padding:12px 16px 4px;font-size:14px;line-height:1.5}
.rnow b{font-size:22px}
.rng{display:flex;gap:6px;padding:6px 16px 4px;flex-wrap:wrap}
.rng button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;font-size:12px;color:var(--body);cursor:pointer}
.rng button.on{background:#1d232a;color:#fff;border-color:#1d232a}
.cv{position:relative;height:340px;margin:4px 8px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.cv canvas{width:100%;height:100%;display:block}
.rd{font-size:12px;color:var(--body);padding:4px 16px;min-height:18px;font-variant-numeric:tabular-nums}
.rexp{flex:1;overflow-y:auto;padding:8px 16px 30px;font-size:13px;line-height:1.6;white-space:pre-line;color:var(--body);border-top:1px solid var(--line)}
.wrap{padding-bottom:84px}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock" id="clock"></div>
  <div class="head">
    <h1>박스권 헌터</h1>
    <div class="right">
      <div class="icons">
        <button id="bChat" aria-label="상담"><img src="a/icons/chat.png" alt=""></button>
        <button id="bScan" aria-label="새로고침"><img src="a/icons/refresh.png" alt=""></button>
        <button id="bInfo" aria-label="규칙"><img src="a/icons/info.png" alt=""></button>
      </div>
      <div class="upd" id="upd"></div>
    </div>
  </div>
  <div class="prog" id="prog" hidden><div class="lab" id="progLab"></div><div class="bar"><div class="fill" id="progFill"></div></div></div>
  <div id="list"></div>
  <div class="status" id="status">연결 준비 중</div>
</div>

<div class="sheet" id="chat">
  <div class="sbar"><div class="t"><b>박스권 헌터 상담</b><small>집 맥북의 Claude가 장부·규칙·최근 결과를 보고 답해요</small></div><button id="chatClose">닫기</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="inrow"><textarea id="q" rows="1" placeholder="메시지 입력"></textarea><button id="send">보내기</button></div>
</div>
<div class="sheet" id="info">
  <div class="sbar"><div class="t"><b>매수 규칙</b><small>백테스트를 통과한 규칙만 매수 의견을 내요</small></div><button id="infoClose">닫기</button></div>

function handle(m, live){
  if (!m || m.event !== 'message' || state.seen[m.id]) return;
  state.seen[m.id] = 1;
  var tags = m.tags || [], body = String(m.message || '');
  if (m.topic === T.chat) { addChat({ id: m.id, who: 'me', t: m.time, text: body }); return; }
  if (tags.indexOf('chat') >= 0) { addChat({ id: m.id, who: 'bot', t: m.time, text: body }); state.chatWaitAt = 0; LS.set('bh_chatWait', 0); return; }
  if (tags.indexOf('ack') >= 0) { if (m.time * 1000 >= state.reqAt - 5000) state.ackAt = m.time * 1000; return; }
  if (body.charAt(0) === '{') {
    try { var j = JSON.parse(body); } catch(e) { return; }
    if ((j.v || 0) >= 2 && m.time >= (state.resultTime || 0)) {
      state.result = j; state.resultTime = m.time; state.title = m.title || '';
      LS.set('bh_result', j); LS.set('bh_resultTime', m.time); LS.set('bh_title', state.title);
      if (tags.indexOf('req') >= 0 && state.reqAt && m.time * 1000 >= state.reqAt - 5000) finishProg(true);
      render();
    }
  } else if (tags.indexOf('warn') >= 0 && tags.indexOf('req') >= 0 && state.reqAt) { finishProg(false, body); }
}

    t.split('\n').forEach(function(l){ if (!l) return; try { var m = JSON.parse(l); if (!m.topic) m.topic = topic; handle(m, false); } catch(e){} });
  });
}

  }
  state.chat.push(c); state.chat.sort(function(a, b){ return a.t - b.t; });
  if (state.chat.length > 120) state.chat = state.chat.slice(-120);
  LS.set('bh_chat', state.chat); renderChat();
}
function renderChat(){
  if (!$('chat').classList.contains('on')) return;
  var h = '';
  if (!state.chat.length) h = '<div class="wait">무엇이든 물어보세요. 예: "오늘 TQQQ 사도 돼?", "⑥번 규칙 설명해줘", "새 대화"</div>';
  state.chat.forEach(function(c){
    var t = new Date(c.t * 1000).toTimeString().slice(0, 5);
    h += '<div class="msg ' + c.who + '">' + (c.who === 'me' ? '<span class="tm">' + t + '</span>' : '') + '<div class="bub">' + esc(c.text) + (c.fail ? ' ⚠️' : '') + '</div>' + (c.who === 'bot' ? '<span class="tm">' + t + '</span>' : '') + '</div>';
  });
  if (state.chatWaitAt) h += '<div class="wait">' + (Date.now() - state.chatWaitAt > 240000 ? '4분째 답이 없어요. 맥이 꺼져 있을 수 있어요.' : '답장 쓰는 중…') + '</div>';
  var box = $('msgs'); box.innerHTML = h; box.scrollTop = box.scrollHeight;
}
function sendChat(){
  var q = $('q').value.trim(); if (!q) return;
  $('q').value = ''; autoGrow();
  var c = { id: 'me' + Date.now(), who: 'me', t: Math.floor(Date.now() / 1000), text: q, local: true };
  state.chat.push(c); state.chatWaitAt = Date.now(); LS.set('bh_chatWait', state.chatWaitAt); LS.set('bh_chat', state.chat); renderChat();
  fetch(NT, { method: 'POST', body: JSON.stringify({ topic: T.chat, title: 'chat', message: q }) })
    .then(function(r){ if (!r.ok) throw new Error(r.status); })
    .catch(function(){ c.fail = true; state.chatWaitAt = 0; LS.set('bh_chat', state.chat); renderChat(); toast('보내지 못했어요. 다시 보내 주세요'); });
}
function autoGrow(){ var t = $('q'); t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }

// ── 규칙
var RULES = "■ 원칙\n백테스트를 통과한 규칙만 매수 의견을 내요. 신호가 없는 날이 대부분이고 \"매수 의견 없음\"이 정상이에요. 무기는 QQQ·TQQQ·UGL·SOXL·SOXS(④⑧만 개별 종목).\n\n■ 등급\n· S 강력 매수: 과거 승률 약 90%, 비중 크게\n· A 매수: 승률 약 73%, 비중 보통\n· B 참고: 기준보다 못해서 매수 안 함(제목에만 표시)\n(2011~2026 신호 236건 검증: S·A는 같은 종목 아무 날보다 +5~6%p, B는 −1.4%p)\n\n■ ① 급락 초입 → QQQ 40일\nS&P가 60일 고점 대비 −7% 이상, 단 직전 25일 안에 고점 근처였던 '초입'만. 23회 40일 +7.1% 승 74%. 며칠 늦게 사도 됨.\n\n■ ② 나스닥 박스 하단 → TQQQ (최대 15일)\nQQQ가 60일간 +12% 오른 뒤 폭 4~12% 박스, 15일 이상, 바닥 2번 확인, 하단 20% 안, 200일선 위. QQQ가 50일선 −3% 이내면 S. 목표 박스 75%, QQQ 박스 바닥 −4% 닿으면 바로 자동매도. 2일 안에 사야 함.\n\n■ ③ 유가 급등 + S&P 하락 → TQQQ 20~30일\n유가(USO) 하루 +5% 이상인데 S&P는 하락, QQQ 200일선 위. TQQQ 20일 +13.5% 승 78%.\n\n■ ④ 실적주 급락 + 공포 여론 → 개별주 20~60일\n3일 −8% 이상 급락, 매출 증가·흑자·부채비율 200% 미만. 토스 댓글에 '무섭·말이 되냐·한강·눈물·끝났·패닉' 같은 감정형 공포가 많고, '줍줍·물타기'나 '어디까지·살려' 같은 말보다 많을 때. 20일 +12~19% 승 79~87%(표본 작음).\n\n■ ⑤ 금리·금·은 동반 하락 → UGL 20일\n하루에 금리(IEF로 판단)·금·은이 모두 평소보다 크게 빠진 '다 팔아치우는 날'. 그날 S&P도 하락이면 A, 금이 50일선 위면 S. UGL 20일 +7.0% 승 77%.\n\n■ ⑥ 반도체만 급락 → TQQQ 20일(−15% 손절)\nQQQ는 200일선 위인데 반도체(SOXX)가 5일 −7% 이상. 34건 +8.7% 승 74%. 다음 날 시가까지 사야 함.\n\n■ ⑦ 1분봉 V자 반등 후 횡보(관찰) → 당일 종가 매도\n미국장 개장 후 1시간 반 동안 5분마다 확인. 나스닥과 같이 빠졌다 회복한 V자만. 알림 없이 화면·기록만(B+).\n\n■ ⑧ 시장 급락일 과하게 빠진 종목 → 5~20일\n나스닥 −1.5% 이상 빠진 날, 평소 움직임(베타)보다 −5%p 이상 더 빠진 종목을 급락 직후 데이마켓에서 매수. 반도체 A(20일 +5.9%p 승 63%), 그 외 B+(+2.8%p 승 55%). 돌아서길 기다리면 수익 절반. 아침 8시 50분 검색. 실적 발표 때문에 빠진 종목은 자동으로 빼요(뉴스 제목으로 판단, 실적 급락은 20일 뒤에도 −1~−5%p로 약했음).\n\n■ ⑨ 반도체 급락 반등 → SOXL (최대 15거래일)\nSOXX 종가가 직전 20거래일 최고 종가보다 −12% 이상 빠지면 다음 날 SOXL 매수. 산 값 기준 +40% 익절, −20% 손절(SOXX로 약 −7%), 15거래일째 종가 매도. 2012~26 아무 날 산 것보다 건당 +9.2 / +1.5 / +7.7%p(기간별), 승률 57~67%. 5일 급락 속도로 재면 효과 없음(깊이가 중요). 반도체만 단체로 급락한 날(SOXX −3% 이하, S&P는 덜)엔 2거래일 기다렸다 사요. 위험 모드면 절반만.\n\n■ ⑩ 위험 모드 추세 이탈 → SOXS (최대 10거래일, 인버스)\n반반도체지수 90 이상인데 SOXX 종가가 20일선을 처음 밑돌면 다음 날 SOXS 매수. +15% 익절, −10% 손절 자동 주문 필수, 10거래일째 종가 매도. 30건 건당 +2.2 / +3.0 / +2.8%(아무 날 SOXS는 −1.2~−2.2%). 이기는 건 절반뿐이라 손절이 생명, 소액(B+).\n\n■ ⑪ 위기 매수 → QQQ·SOXX (1~3년, 몇 년에 한 번)\nQQQ나 SOXX가 최고가 대비 −30% · −40% · −50%에 처음 닿을 때마다 나눠서 사요. 총 매수 계획의 1차 30% · 2차 30% · 3차 40% — 카드에 이번에 넣을 비율이 적혀 있어요. 과거 위기 매수는 대부분 크게 벌었지만(2020 코로나 1년 +135%, 2022-09 3년 +154%), 2008·닷컴처럼 −30%에서 사도 −40~−75%가 더 남은 적이 있어서 한 번에 다 넣지 않아요. 최고가 대비 −15% 안으로 회복하면 다시 처음부터.\n\n■ 화면 아래 반반도체지수\n클석진 반반도체 지수와 지금 반도체 주식 의견 한 줄이 늘 떠 있고, 높을수록 진한 빨강이에요. 누르면 일봉 그래프(SOXX와 함께)가 열려요. 90 이상(위험 모드)이면 TQQQ와 ⑧ 반도체주 매수 의견은 평소의 절반만 사세요.\n\n■ ⓒ 상시 카드(C등급) — 언제 사도 되는 교과서적 장기 전략\n규칙 신호가 아니라 늘 떠 있는 카드예요. 수익은 낮거나 느리지만 등락을 견디는 용도이고, 알림·성적표에는 넣지 않아요.\n· 현금 대기(SGOV): 3개월 국채 금리 3% 이상일 때. 다른 카드를 기다리는 돈을 여기에.\n· 매달 적립(QQQ): 매달 같은 날 같은 금액, 팔지 않기. 2007년부터 7.5배·2011년부터 5.3배(넣은 돈 대비 최대 −39~−49%).\n· 매달 적립(QLD 2배): QQQ가 200일선 위일 때만 새로 넣기. 2011년부터 18.7배지만 최대 −67~−77%까지 빠졌던 돈이라 일부만.\n· 중기 국채(IEF): 10년 금리 4.5% 이상일 때 나눠 사서 높은 금리 고정. 주식 급락 때 버팀목.\n\n■ 이 웹 화면\n블랙베리 앱과 같은 결과를 보여 줘요. 새로고침(↻)은 집 맥에 지금 시세로 다시 찾아 달라고 요청해요(1~2분). 알림은 블랙베리 앱으로만 와요.\n아이폰 사파리에서 공유 → '홈 화면에 추가'하면 앱처럼 쓸 수 있어요.\n\n※ 참고용 신호예요. 주문은 직접 판단하세요.";

var RISK = "■ 클석진 반반도체 지수(반반도체지수) v5\n반도체(SOXX)가 앞으로 크게 빠질 위험을 0~100으로 보여 줘요. 매일 미국장 마감 기준으로 다시 계산하고, 두 축 중 낮은 값을 써요(둘 다 높아야 높음).\n\n· 급락 위험 축(주황): 미국 10년 금리 수준, 금융여건(NFCI) 13주 변화, 순유동성 감소, 원달러 수준(3년 대비), 기대인플레·유가 하락, 반도체 가이던스 감속, 장단기 금리차 축소, 2년 금리 120일 상승. 급락 확률은 잘 맞히지만 2023~26엔 높을 때 오히려 크게 오르기도 했어요(양방향 출렁임).\n· 사이클 축(파랑): 순유동성 감소, 반도체 매출 성장 감속, 10년 금리, 미국 반도체 가동률(생산/능력), 반도체 19개사 매출 성장(사이클 고점일수록 높음), 장단기차 축소, 2년 금리 상승. 높을 때 60일 뒤 수익이 세 기간 모두 낮았어요(4.1 vs 7.6% · −6.1 vs 10.9% · −4.2 vs 11.6%).\n\n· 90 이상 = 위험 모드(두 축 모두 90 이상): 그동안 현금으로 바꿨다면 SOXL 연 49.8→58.6%(2013~18) · 13.2→53.5%(2019~22) · 97.8→155.6%(2023~26), SOXX 19.5→21.7 · 21.5→32.1 · 50.4→60.0%. 위험 모드는 전체의 6~14%의 날\n· 한계: 요인을 같은 기간에서 골라 실전은 이보다 못할 수 있어요. 코로나·딥시크 같은 갑작스러운 충격은 못 잡아요. 매출 자료는 실적 시즌마다 갱신해요.\n\n■ 추가 하락 가능성(반도체가 20일 고점 대비 −8% 이상 빠졌을 때만)\n이미 빠진 뒤 '더 빠질까, 멈출까'를 봐요. 급락 위험 축, 금융여건 악화, 원화·달러 강세, 기대인플레 하락, 시장 전체 하락, VIX 단기 공포, 천천히 빠지는지를 합쳐요. 점수 상위 1/3이면 20일 안 −7% 더 빠질 확률 약 50%, 하위 1/3이면 15% 안팎.\n\n■ 알림: 위험 모드에 처음 들어갈 때(80 밑으로 내려갔다 다시 90을 넘으면 또), 반도체 급락(−8%)이 새로 시작될 때\n\n";
// ── 연결
$('bScan').onclick = requestScan;
$('bChat').onclick = function(){ $('chat').classList.add('on'); renderChat(); poll(T.chat, '12h').then(renderChat).catch(function(){}); setTimeout(function(){ $('q').focus(); }, 50); };
$('chatClose').onclick = function(){ $('chat').classList.remove('on'); };
function statsText(){ var st = state.result && state.result.st; if (!st || !st.r || st.v !== 2) return '';
  var names = { '①':'급락 초입 → QQQ', '②':'나스닥 박스 하단 → TQQQ', '③':'유가 급등 → TQQQ', '④':'실적주 공포 여론', '⑤':'금·금리 동반 하락 → UGL', '⑥':'반도체만 급락 → TQQQ', '⑦':'1분봉 V자(관찰)', '⑧':'급락일 과하게 빠진 종목', '⑨':'반도체 급락 반등 → SOXL', '⑩':'위험 모드 추세 이탈 → SOXS', '⑪':'위기 매수(QQQ·SOXX)' };
  var t = '■ 이번 주 성적표 (' + st.at + ' 미국장 마감까지, 매주 토요일 아침 갱신)\n점수 = 승률 × 기대 이익(아무 날 대비 평균 초과수익, 20거래일 환산)\n\n';
  Object.keys(names).forEach(function(k){ var x = st.r[k]; if (!x) return; var g = x[0];
    t += k + ' ' + names[k] + ' — ' + g + '등급' + (g === 'B' ? '(알림 멈춤)' : '') + '\n   ';
    if (x[3] != null && x[4] != null) t += x[1] + ' ' + x[2] + '건 · 승률 ' + x[3] + '% · 기대 이익 ' + (x[4] >= 0 ? '+' : '') + x[4] + '%p · 점수 ' + x[5];
    else t += '실전 기록 쌓는 중(10건부터 채점, 그전엔 처음 검증 등급)';
    if (x[1] !== '실전') t += ' · 실전 ' + (x[6] ? x[6] + '건 승률 ' + x[7] + '%' : '기록 쌓는 중');
    t += '\n'; });
  return t + '\n등급: S 점수 4↑ · A 2↑ · B+ 1↑ · 그 밖 또는 기대 이익 0 이하는 B\n\n'; }
$('bInfo').onclick = function(){ var rest = RULES.replace(/■ [①-⑪][\s\S]*?(?=■ 화면 아래)/, '');
  $('rules').innerHTML = binderHTML() + '<div class="rtext">' + esc(statsText() + rest) + '</div>'; $('info').classList.add('on'); };
$('rules').addEventListener('click', function(e){ var b = e.target.closest('.mc'); if (b) openRuleCard(+b.dataset.i); });
$('ov').onclick = function(e){ if (e.target.id === 'ov' || e.target.id === 'ovX') $('ov').hidden = true; };
$('rbar').onclick = rkOpen;
$('infoClose').onclick = function(){ $('info').classList.remove('on'); };
$('send').onclick = sendChat;
$('q').addEventListener('input', autoGrow);
$('q').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });
document.addEventListener('keydown', function(e){
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  var k = e.key.toLowerCase();
  if (k === 'l' || k === 's') requestScan(); else if (k === 'c') $('bChat').onclick(); else if (k === 'i') $('bInfo').onclick(); else if (k === 'r') refresh();
  else if (k === 'escape') { $('chat').classList.remove('on'); $('info').classList.remove('on'); $('rk').classList.remove('on'); }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { refresh(); connect(); } });
setInterval(function(){ tick(); if (state.chatWaitAt) renderChat(); }, 30000);
render(); refresh().then(connect);
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>첨부 미리보기 · JIN-mail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f6368' stroke-width='1.8'%3E%3Cpath d='M3 5.5h18v13H3zM3.5 6.5l8.5 6.5 8.5-6.5'/%3E%3C/svg%3E">
<style>
@font-face{font-family:Pretendard;src:url(fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920}
:root{--ink:#1f1f1f;--sub:#5f6368;--mute:#80868b;--line:#e1e3e6;--blue:#0b57d0}
*{box-sizing:border-box}
body{margin:0;background:#eef0f3;color:var(--ink);font:14px/1.5 Pretendard,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.ft{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;color:#fff}
.ft.XLS{background:#188038}.ft.PPT{background:#c5501e}.ft.PDF{background:#d93025}.ft.DOC{background:#1a5dc8}.ft.IMG{background:#7b5cc4}.ft.ZIP{background:#5f6368}
.nm{font-weight:600}.meta{color:var(--sub);font-size:12.5px}
.sp{flex:1}
.btn{border:1px solid #c4cbd6;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#f1f3f5}
.note{background:#fff8e1;color:#6b5000;font-size:12.5px;padding:6px 16px;border-bottom:1px solid #f1e3b0}
main{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center}
.page{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);border-radius:2px}
/* 엑셀 */
.xl{border-collapse:collapse;font-size:12.5px;background:#fff}
.xl th,.xl td{border:1px solid #dadce0;padding:3px 10px;min-width:80px;white-space:nowrap}
.xl th{background:#f1f3f4;color:var(--sub);font-weight:500}
.xl td.n{text-align:right}.xl tr.h td{background:#e6f4ea;font-weight:700}.xl tr.t td{font-weight:700;border-top:2px solid #5f6368}
.tabs{display:flex;gap:2px;margin-top:6px}.tabs span{background:#fff;border:1px solid #dadce0;border-top:0;padding:3px 14px;font-size:12px;color:var(--sub)}.tabs span.on{color:#188038;font-weight:700}
/* 슬라이드 */
.slides{display:flex;flex-direction:column;gap:18px}
.slide{width:800px;height:450px;padding:44px 56px;display:flex;flex-direction:column}
.slide h1{margin:0 0 18px;font-size:30px}.slide .k{color:#c5501e;font-weight:700;font-size:13px;letter-spacing:.08em}
.slide ul{font-size:18px;line-height:1.9}.slide .num{margin-top:auto;color:var(--mute);font-size:12px;text-align:right}
.bars{display:flex;align-items:flex-end;gap:26px;height:200px;margin-top:10px}.bars div{width:70px;background:#f0b49b;border-radius:4px 4px 0 0;position:relative}.bars div span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--sub)}
/* 문서·PDF */
.doc{width:720px;min-height:960px;padding:64px 72px;font-size:13.5px;line-height:1.85}
.doc h1{font-size:22px;margin:0 0 4px}.doc .sub{color:var(--sub);margin-bottom:28px}
.doc h3{font-size:15px;margin:26px 0 6px}.doc .ph{height:12px;background:#eceff1;border-radius:3px;margin:9px 0}
.img{max-width:900px;width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#c9d6ff,#e2e2e2);display:flex;align-items:center;justify-content:center;color:#5f6368;font-size:15px}
.zip{background:#fff;border-radius:10px;padding:20px 26px;min-width:520px;align-self:flex-start}.zip div{padding:7px 0;border-bottom:1px solid #f1f3f5;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="bar"><span class="ft" id="ft"></span><span class="nm" id="nm"></span><span class="meta" id="meta"></span><span class="sp"></span><button class="btn" id="dl">내려받기</button><button class="btn" id="cl">닫기</button></div>
<div class="note">샘플 미리보기예요. 실제 버전에서는 Gmail이 만들어 주는 미리보기를 이 창에 그대로 띄워서 엑셀·PPT·PDF·워드·이미지를 모두 볼 수 있어요.</div>
<main id="main"></main>
<script src="preview.js"></script>
</body>
</html>

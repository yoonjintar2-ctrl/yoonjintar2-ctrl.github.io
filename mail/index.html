<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">

<title>jinny mail</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef1f5">
<link rel="apple-touch-icon" href="appicons/apple-180.png?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2214.5%22%20fill%3D%22%23202124%22%2F%3E%3Cg%20transform%3D%22translate(1.5%203.5)%22%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M18.5%2035.5Q18.5%2046%2033.5%2046Q48.5%2046%2048.5%2035.5Z%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M24%2034Q24%2026.5%2033.5%2026.5Q43%2026.5%2043%2034Z%22%2F%3E%3Ccircle%20fill%3D%22%23fff%22%20cx%3D%2233.5%22%20cy%3D%2224.2%22%20r%3D%222.4%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M20.5%2041.5C13%2041.5%209.5%2036%205.5%2030.5Q5%2029.5%206.3%2029.6L8.6%2029.8C12.5%2034.5%2015.5%2036.3%2020.5%2036.3Z%22%2F%3E%3Cpath%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%20d%3D%22M47.5%2033.6C55.5%2031.8%2057.8%2041.8%2046.4%2041.8%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M28.5%2045.5H38.5L40.5%2050.5Q40.7%2051.5%2039.6%2051.5H27.4Q26.3%2051.5%2026.5%2050.5Z%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M10.5%2010.8Q11.332%2015.168%2015.7%2016Q11.332%2016.832%2010.5%2021.2Q9.668%2016.832%205.3%2016Q9.668%2015.168%2010.5%2010.8Z%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20opacity%3D%22.6%22%20d%3D%22M18.5%206.7Q18.948%209.052%2021.3%209.5Q18.948%209.948%2018.5%2012.3Q18.052%209.948%2015.7%209.5Q18.052%209.052%2018.5%206.7Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
@font-face{font-family:"Pretendard";src:url("fonts/PretendardVariable.woff2") format("woff2-variations");font-weight:45 920;font-display:swap}
:root{
  --ink:#1f1f1f; --sub:#5f6368; --mute:#80868b; --line:#e3e6eb; --line2:#eef0f3;
  --bg:#f3f5f8; --panel:#fff; --chrome:#eef1f5; --hover:#f2f4f7; --readbg:#f5f6f8;
  --compose:#e9f0fb; --compose-line:#d6e2f3;
  --blue:#0b57d0; --blue-d:#0842a0; --blue-l:#e8f0fe; --blue-m:#d3e3fd;
  --w-nav:220px; --w-list:420px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.5 "Pretendard","Malgun Gothic","맑은 고딕",sans-serif;font-feature-settings:"tnum" 0;letter-spacing:-.1px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #c9ced6;background:#fff;border-radius:7px;padding:6px 12px;color:#3c4043;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default;background:#fff}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--blue-d)}
.btn.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue);font-weight:600}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;border-radius:7px;color:var(--sub);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}

/* ── 맨 위 ── */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:16px 14px;background:var(--chrome)}  /* 위 검색줄 + 왼쪽 편지함 = 같은 회색 틀(고정된 머리 부분) */
.newbtn{width:calc(var(--w-nav) - 69px);min-width:120px;flex:none;height:40px;justify-content:center;font-size:15px;border-radius:10px}
.refbtn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid #c9ced6;background:#fff;color:#5f6368;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.refbtn:hover{color:var(--blue);border-color:var(--blue)}
.refbtn.spin svg{animation:jspin .7s linear infinite}
.sbwrap{position:relative;flex:none;width:var(--w-list);min-width:200px}  /* 검색창 오른쪽 끝 = 메일 목록 오른쪽 끝 */
.sbox{display:flex;align-items:center;height:40px;border:1.5px solid #c9ced6;border-radius:10px;background:#fff;overflow:hidden}
.sbox:focus-within{border-color:var(--blue)}
.sbox input{flex:1;min-width:0;border:0;outline:none;padding:0 14px;font-size:14px}
.sbox .go{height:100%;width:46px;border:0;border-left:1px solid var(--line);background:#f6f8fb;color:var(--sub);display:flex;align-items:center;justify-content:center}
.sbox .go:hover{background:var(--blue-l);color:var(--blue)}
.sugg{position:absolute;left:0;right:0;top:44px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.14);padding:6px 0;display:none;max-height:420px;overflow:auto}
.sugg.on{display:block}
.sugg .sh{padding:6px 14px 2px;font-size:11px;color:var(--mute)}
.sugg .si{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer}
.sugg .si:hover,.sugg .si.on{background:var(--blue-l)}
.sugg .si .s1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .si .s2{font-size:12px;color:var(--mute);white-space:nowrap}
.sugg mark{background:#fde68a;color:inherit;border-radius:2px}
.fbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid #c9ced6;background:#fff;color:var(--sub)}
.fbtn:hover{background:var(--hover);color:var(--ink)}
.fbtn.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.fbtn.on::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.top .sp{flex:1}

/* ── 목록 위 자주 쓰는 필터 (글자 버튼) ── */
.lfilt{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line2);background:var(--panel);flex-wrap:wrap}
.lfilt .tf{display:inline-flex;align-items:center;gap:3px;max-width:180px;height:28px;padding:0 10px;border:1px solid #c9ced6;border-radius:14px;background:#fff;color:#3c4043;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lfilt .tf:hover{background:var(--hover)}
.lfilt .tf .cv{color:var(--mute);font-size:10px;margin-left:1px}
.lfilt .tf.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue);font-weight:600}
.lfilt .tf.on .cv{color:var(--blue)}
.lfilt .tfx{border:0;background:none;color:var(--mute);font-size:12px;padding:0 4px;text-decoration:underline}
.lfilt .tfx:hover{color:var(--blue)}
.lfilt.off .tf{opacity:.45}
/* 선택한 메일이 있으면 위 막대를 파랗게 */
.lhead{transition:background .12s}
.lhead.sel{background:var(--blue-m);border-bottom-color:#a8c7fa;color:var(--blue-d)}
.lhead.sel .cnt b{color:var(--blue-d)}
/* 대화 보기 */
.convbar{flex:none;display:flex;align-items:center;gap:7px;padding:8px 10px;background:#eef3fb;border-bottom:1px solid #d6e2f3;color:var(--blue-d);font-size:13px}
.convbar .k{flex:none;font-weight:700}
.convbar b{flex:1;min-width:0;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convbar .n{flex:none;color:var(--sub);font-size:12px}
.convbar .btn{flex:none;padding:3px 9px;font-size:12px}
.lhead .convt{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1;color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .convt b{overflow:hidden;text-overflow:ellipsis}
.row{position:relative}
.row .convb{position:absolute;right:10px;top:31px;display:none;align-items:center;gap:2px;height:20px;padding:0 5px;border:1px solid transparent;border-radius:10px;background:transparent;color:#80868b;font-size:11px;font-weight:600;line-height:1}
.row .convb.has{display:inline-flex}
.row .convb svg{width:15px;height:15px}
.row .convb:hover{border-color:#a8c7fa;background:#fff;color:var(--blue)}
.row .subj{padding-right:34px}
.row .snip{padding-right:26px}
.row .snip .atti{display:inline-flex;align-items:center;gap:2px;vertical-align:-2px;margin-right:6px}
.row .snip .atti svg,.row .snip .atti img{width:14px;height:14px}
.row .snip .atti b{font-size:11px;font-weight:600;color:#7a8089;margin-left:1px}
/* 즐겨찾기 별: 대화 표시 아래 */
.row .starb{position:absolute;right:11px;bottom:8px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;padding:0;cursor:pointer;border-radius:6px}
.row .starb svg{fill:none;stroke:#c4c9d2}
.row .starb:hover svg{stroke:#9aa0a6}
.row .starb.on svg{fill:#fbbc04;stroke:#f29900}
.lfilt .tfstar{width:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.lfilt .tfstar svg{fill:none;stroke:#80868b}
.lfilt .tfstar.on{background:#fff7d6;border-color:#f6c445}
.lfilt .tfstar.on svg{fill:#fbbc04;stroke:#f29900}
.l3.compact .mini .nm{display:inline}  /* 종류+개수는 짧아서 항상 보이게 */

/* ── 본문 3칸 + 경계선 끌기 ── */
.body{flex:1;min-height:0;display:flex;background:var(--chrome)}
nav{width:var(--w-nav);flex:none;background:var(--chrome);overflow:auto;padding:8px 0 20px}
nav + .split::after{background:transparent}
/* 편지함 목록 스크롤바: 평소엔 숨기고 굴릴 때만 얇게, 화살표·흰 바탕 없이 */
nav::-webkit-scrollbar{width:8px;background:transparent}
nav::-webkit-scrollbar-track{background:transparent}
nav::-webkit-scrollbar-button{display:none;width:0;height:0}
nav::-webkit-scrollbar-corner{background:transparent}
nav::-webkit-scrollbar-thumb{background:transparent;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
nav.scrolling::-webkit-scrollbar-thumb{background-color:rgba(60,72,88,.32)}
nav.scrolling::-webkit-scrollbar-thumb:hover{background-color:rgba(60,72,88,.5)}
.list{border-top-left-radius:12px;overflow:hidden}
/* 목록·본문·작성 창 = 회색 틀 위에 얹힌 둥근 카드 */
.body{padding:0 10px 10px 0}
.list,.read{border-radius:14px;overflow:hidden;border:1px solid #e1e5eb;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.split[data-split=list]{width:10px;margin:0}
.split[data-split=list]::after{left:4px;background:transparent}
.split[data-split=list]:hover::after,.split[data-split=list].drag::after{left:3px;width:3px;background:var(--blue)}
body.popmode .body{padding:0}
body.popmode .read{border-radius:0;border:0;box-shadow:none}
.split{width:7px;flex:none;cursor:col-resize;background:transparent;margin:0 -3px;position:relative;z-index:5}
.split::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:var(--line);transition:background .12s}
.split:hover::after,.split.drag::after{left:2px;width:3px;background:var(--blue)}
.nh{display:flex;align-items:center;justify-content:space-between;margin:16px 8px 4px 16px;font-size:12px;color:var(--mute)}
.ni{position:relative;display:flex;align-items:center;gap:9px;height:34px;padding-right:6px;border-left:3px solid transparent;cursor:pointer;user-select:none;color:var(--ink);font-size:14px}
.ni:hover{background:rgba(31,45,61,.06)}
.ni.on{background:var(--blue-l);border-left-color:var(--blue);font-weight:600;color:var(--blue)}
.ni .ic{color:var(--sub);display:flex}
.ni.on .ic{color:var(--blue)}
.ni .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .tw{width:16px;display:flex;justify-content:center;color:var(--mute)}
.ni .tw svg{width:13px;height:13px}
.ni .n{font-size:12px;font-weight:600;color:var(--sub);min-width:18px;text-align:right}
.ni.on .n{color:var(--blue)}
.ni .dots{display:none;width:26px;height:26px}
.ni:hover .dots,.ni.menu-open .dots{display:inline-flex}
.ni:hover .n,.ni.menu-open .n{display:none}
.ni.unread .nm{font-weight:700}
.ni.drop-in{background:var(--blue-m)}
.ni.drop-before::before,.ni.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:2px;background:var(--blue)}
.ni.drop-before::before{top:0}.ni.drop-after::after{bottom:0}
.ni.hid{opacity:.5}
.ni input.ren{flex:1;min-width:0;border:1px solid var(--blue);border-radius:5px;padding:2px 6px;font-size:13px;outline:none}
.hidtoggle{margin:8px 16px 0;border:0;background:none;color:var(--mute);font-size:12px;padding:4px 0}
.hidtoggle:hover{color:var(--blue)}

.list{width:var(--w-list);flex:none;display:flex;flex-direction:column;background:var(--panel)}
.lhead{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-bottom:1px solid var(--line2);color:var(--sub);font-size:12px}
.lhead .cnt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .cnt b{color:var(--blue)}
.lhead .btn{padding:4px 9px;font-size:12px}
input.ck{width:15px;height:15px;margin:0;accent-color:var(--blue);cursor:pointer;flex:none}
.rows{flex:1;overflow:auto}
.grp{padding:6px 14px;font-size:12px;font-weight:600;color:var(--mute);background:#f9fafb;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line2)}
.row{display:flex;gap:10px;padding:10px 12px 10px 10px;border-bottom:1px solid #eceef2;cursor:default;user-select:none;background:var(--readbg)}
.row:hover{background:#eceff3}
.row.unread{background:#fff}
.row.unread:hover{background:#f6f8fb}
.row .ck{margin-top:3px;opacity:.35}
.row:hover .ck,.row.picked .ck{opacity:1}
.row .mid{flex:1;min-width:0}
.row .l1{display:flex;gap:6px;align-items:center}
.row .who{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444746}
.row .dt{font-size:12px;color:var(--mute);flex:none}
.row .subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;color:#5f6368;font-size:13.5px}
.row .l3{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.row.unread .who,.row.unread .subj{font-weight:700;color:var(--ink)}
.row.unread .dt{color:var(--blue);font-weight:600}
.row.open{background:var(--blue-l)!important}
.row.picked{background:#dbe6fa!important}
.row.dragging{opacity:.5}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.draft{font-size:11px;font-weight:700;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:0 5px;background:#fff}
.ft{display:inline-block;font:700 10px/15px Arial,sans-serif;color:var(--sub);border:1px solid #c4c9d2;border-radius:3px;padding:0 4px;margin-right:4px;background:#fff}
.mini{font-size:12px;color:var(--sub);white-space:nowrap}

/* ── 오른쪽: 읽기 ── */
.read{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.view{display:flex;flex-direction:column;flex:1;min-height:0}
.blank{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.rhead{flex:none;padding:18px 22px 12px;border-bottom:1px solid var(--line2)}
.rhead h2{margin:0 0 12px;font-size:22px;font-weight:700;line-height:1.35;letter-spacing:-.3px}
.hrow{display:flex;gap:16px;align-items:flex-start}
.people{flex:1;min-width:0}
.from{font-size:16px;font-weight:700}
.from .addr{font-size:13px;font-weight:400;color:var(--sub);margin-left:5px}
.pl{font-size:12.5px;color:var(--sub);margin-top:3px}
.pl .k{display:inline-block;width:32px;color:var(--mute)}
.pl .me{font-weight:700;color:var(--blue);background:var(--blue-l);border-radius:4px;padding:0 5px}
.pl.tome{color:#3c4043}
.nsep-trash{height:1px;background:var(--line);margin:10px 14px 6px}
.pplmore{border:none;background:var(--blue-l);color:var(--blue);border-radius:10px;padding:0 8px;font-size:12px;cursor:pointer;margin-left:2px}
.pplmore:hover{text-decoration:underline}
.boxchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:12px;padding:1px 10px;margin-top:8px}
.racts{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.racts .bar{display:flex;gap:4px;align-items:center}
.racts .when{font-size:12px;color:var(--mute)}
.attbar{flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 22px;background:#f8f9fb;border-bottom:1px solid var(--line2)}
.attbar b{font-size:12.5px;color:var(--sub);margin-right:4px;display:flex;align-items:center;gap:4px}
.att{display:inline-flex;align-items:center;gap:5px;border:1px solid #dadce0;border-radius:7px;padding:5px 9px;background:#fff;font-size:13px;white-space:nowrap;cursor:pointer}
.att:hover{border-color:var(--blue);color:var(--blue)}
.attw .att{min-width:0;flex:0 1 auto}
.att .an{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attmore:hover{text-decoration:underline}
.att small{flex:none}
.row .l3 .ftc{display:inline-flex;align-items:center;gap:2px;flex:none;font-size:11.5px;color:#7a8089}
.row .l3 .ftc b{font-weight:600}
.attw .att{border-radius:7px 0 0 7px}
.attbtn{display:flex;align-items:center;justify-content:center;width:30px;border:1px solid #dadce0;border-left:none;background:#fff;color:var(--sub);cursor:pointer;padding:0}
.attbtn:last-child{border-radius:0 7px 7px 0}
.attbtn:hover{color:var(--blue);border-color:var(--blue);background:#f4f8ff}
.attbtn.busy{cursor:progress;color:var(--blue)}
.attdrv.done{color:#1e8e3e}
.donut{width:17px;height:17px}
.donut circle{fill:none;stroke-width:3}
.donut .dbg{stroke:#e3e7ee}
.donut .dfg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dasharray .15s}
.donut.spin{animation:dspin .9s linear infinite}
@keyframes dspin{to{transform:rotate(360deg)}}
.att small{color:var(--sub)}
/* 첨부 막대: 한 줄에 3개까지, 긴 이름은 … / [펼치기]로 전체 이름 */
.attbar{align-items:flex-start;flex-wrap:nowrap;gap:10px}
.attbar > b{flex:none;padding-top:6px}
.attgrid{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.attgrid .attw{display:flex;min-width:0;max-width:calc((100% - 16px) / 3)}
.attgrid .att{flex:0 1 auto;min-width:0}
.att .an{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .fti,.att small,.attdrv{flex:none}

/* 시작 로딩 화면 */
#boot{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center}
#boot .bootbox{text-align:center;color:var(--sub)}

@keyframes bootspin{to{transform:rotate(360deg)}}
#boot .later{display:block;margin:12px auto 0;border:0;background:none;color:var(--mute);font-size:12.5px;cursor:pointer}
/* 편지함 상·하위 연결선 없음 */
.ni .g{display:none}
/* 로딩: 봉투 등장 → 뚜껑 열림 → 편지 솟음(글씨 써짐) → 들어감 → 뚜껑 닫힘 → 통통 (반복, 3.4초)
   앞뒤 순서: 열린 뚜껑(뒤) · 봉투 안쪽 · 편지 · 앞 주머니 · 닫힌 뚜껑(맨 앞) */
#boot .envani{width:140px;height:124px;margin:0 auto}
#boot .envani svg{overflow:visible}
#boot .envani .ebody,#boot .envani .letter,#boot .envani .eshadow{transform-box:fill-box;transform-origin:50% 100%}
#boot .envani .ff,#boot .envani .bf{transform-box:fill-box;transform-origin:50% 0}
#boot .envani .ebody{animation:envBody 3.4s infinite}
#boot .envani .eshadow{transform-origin:50% 50%;animation:envShadow 3.4s infinite}
#boot .envani .ff{animation:envFF 3.4s infinite}
#boot .envani .bf{animation:envBF 3.4s infinite}
#boot .envani .letter{transform-origin:50% 50%;animation:envLetter 3.4s infinite}
#boot .envani .ln{stroke-dasharray:60;stroke-dashoffset:60;animation:envLn 3.4s infinite}
#boot .envani .l2{animation-name:envLn2}
#boot .envani .l3{animation-name:envLn3}
@keyframes envBody{
  0%{transform:translateY(14px) scale(.8) rotate(-7deg);opacity:0;animation-timing-function:cubic-bezier(.3,1.6,.6,1)}
  9%{transform:translateY(0) scale(1) rotate(0);opacity:1}
  12%{transform:scale(1.04,.95)} 15%{transform:scale(1)}
  48%{transform:translateY(-3px)} 66%{transform:translateY(0)}
  88%{transform:scale(1);animation-timing-function:ease-in}
  91%{transform:scale(1.07,.9)} 94%{transform:scale(.97,1.04)} 97%,100%{transform:scale(1);opacity:1}}
@keyframes envShadow{0%{transform:scale(.5);opacity:0}9%,88%{transform:scale(1);opacity:1}48%{transform:scale(.9)}91%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes envFF{
  0%,14%{transform:scaleY(1);animation-timing-function:cubic-bezier(.6,0,.9,.4)}
  20%,80%{transform:scaleY(0);animation-timing-function:cubic-bezier(.2,.9,.3,1.3)}
  87%{transform:scaleY(1.05)} 90%,100%{transform:scaleY(1)}}
@keyframes envBF{
  0%,20%{transform:scaleY(0);animation-timing-function:cubic-bezier(.2,.9,.3,1.4)}
  28%{transform:scaleY(-1.08)} 31%,72%{transform:scaleY(-1);animation-timing-function:cubic-bezier(.6,0,.9,.4)}
  80%,100%{transform:scaleY(0)}}
@keyframes envLetter{
  0%,27%{transform:translateY(14px) rotate(0);animation-timing-function:cubic-bezier(.25,1.5,.5,1)}
  40%{transform:translateY(-36px) rotate(-4deg)}
  46%{transform:translateY(-31px) rotate(2deg)}
  52%{transform:translateY(-33px) rotate(-1deg)}
  62%{transform:translateY(-33px) rotate(0);animation-timing-function:cubic-bezier(.55,0,.8,.3)}
  74%,100%{transform:translateY(14px) rotate(0)}}
@keyframes envLn{0%,36%{stroke-dashoffset:60}44%,68%{stroke-dashoffset:0}74%,100%{stroke-dashoffset:60}}
@keyframes envLn2{0%,40%{stroke-dashoffset:60}48%,68%{stroke-dashoffset:0}74%,100%{stroke-dashoffset:60}}
@keyframes envLn3{0%,44%{stroke-dashoffset:60}52%,68%{stroke-dashoffset:0}74%,100%{stroke-dashoffset:60}}
/* 다 불러오면 로딩 화면이 살짝 커지며 사라짐 */

#boot.out{opacity:0;transform:scale(1.03);pointer-events:none}
@media (prefers-reduced-motion:reduce){#boot .envani *{animation:none!important}#boot .envani .bf,#boot .envani .ln{stroke-dashoffset:0}}

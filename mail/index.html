<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>닫힌 주소</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2328;--sub:#6b6f76}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#202327;--ink:#e8eaed;--sub:#9aa0a6}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:16px;box-sizing:border-box}
.c{background:var(--card);border-radius:18px;padding:32px 36px;max-width:420px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.08)}
h1{font-size:19px;margin:0 0 8px}p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
</style></head>
<body><div class="c"><h1>이 주소는 닫혔어요</h1><p>더 이상 이곳에서 서비스하지 않아요.</p></div></body></html>
